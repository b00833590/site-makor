<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Makor Morning News — Globe</title>
</head>
<body>
  <div id="week-timeline" class="week-timeline"></div>
  <div id="globe-container"></div>
  <div id="region-indicator" class="region-indicator"></div>
  <button id="edit-toggle-btn" class="edit-toggle-btn" type="button">✏️ Éditer</button>
  <button id="arrow-prev" class="arrow-btn arrow-prev" aria-label="Région précédente">‹</button>
  <button id="arrow-next" class="arrow-btn arrow-next" aria-label="Région suivante">›</button>
  <aside class="side-panel">
    <div id="panel-region-label" class="panel-region-label"></div>
    <div class="panel-section-label">Indices régionaux</div>
    <div id="panel-indices"></div>
    <div class="panel-section-label">News macro</div>
    <div id="panel-news"></div>
    <div class="panel-section-label">Entreprises présentées</div>
    <div id="panel-companies"></div>
    <div id="panel-compare"></div>
    <div class="panel-section-label">Suivi de portefeuille</div>
    <div id="panel-portfolio-region-label" class="portfolio-region-label"></div>
    <div id="panel-portfolio"></div>
  </aside>
  <div id="chart-modal" class="chart-modal">
    <div class="chart-modal-content">
      <div class="chart-modal-header">
        <span id="chart-modal-title"></span>
        <button id="chart-modal-close" type="button" aria-label="Fermer">✕</button>
      </div>
      <div id="chart-modal-body"></div>
    </div>
  </div>
  <div id="password-modal" class="password-modal">
    <div class="password-modal-content">
      <h3>🔒 Mode édition</h3>
      <input type="password" id="password-input" placeholder="Mot de passe" />
      <div id="password-error" class="password-modal-error">Mot de passe incorrect.</div>
      <div class="password-modal-actions">
        <button id="password-cancel" type="button">Annuler</button>
        <button id="password-ok" type="button">Déverrouiller</button>
      </div>
    </div>
  </div>
  <div id="admin-toast" class="admin-toast"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
